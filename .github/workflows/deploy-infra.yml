name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'amplify.yml'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      use_secrets_manager:
        description: 'Use Secrets Manager for GitHub token (recommended)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1

jobs:
  check:
    name: Check if deployment is needed
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 方法1: OIDC認証
      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.AUTH_METHOD == 'OIDC' || (secrets.AWS_ROLE_ARN != '' && vars.AUTH_METHOD != 'ACCESS_KEY') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 方法2: アクセスキー認証
      - name: Configure AWS Credentials (Access Key)
        if: ${{ vars.AUTH_METHOD == 'ACCESS_KEY' || (secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ROLE_ARN == '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if Amplify app exists
        id: check
        working-directory: infra
        env:
          USE_SECRETS_MANAGER: ${{ github.event.inputs.use_secrets_manager || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Check if the main stack (Amplify) is already deployed
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name NextAmplifyStarterKit --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STACK_STATUS" = "NOT_FOUND" ]; then
            echo "Amplify stack not found — initial deployment required"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STACK_STATUS" == *FAILED* ]] || [[ "$STACK_STATUS" == *ROLLBACK* ]]; then
            echo "Stack in failed state ($STACK_STATUS) — redeployment required"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Stack exists ($STACK_STATUS) — checking for changes"
            # Run cdk diff to check if there are pending changes
            DIFF_OUTPUT=$(npx cdk diff 2>&1) || true
            if echo "$DIFF_OUTPUT" | grep -q "There were no differences"; then
              echo "No changes detected"
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            else
              echo "Changes detected"
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy:
    name: Deploy CDK Stack
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.should_deploy == 'true' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 方法1: OIDC認証
      - name: Configure AWS Credentials (OIDC)
        if: ${{ vars.AUTH_METHOD == 'OIDC' || (secrets.AWS_ROLE_ARN != '' && vars.AUTH_METHOD != 'ACCESS_KEY') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 方法2: アクセスキー認証
      - name: Configure AWS Credentials (Access Key)
        if: ${{ vars.AUTH_METHOD == 'ACCESS_KEY' || (secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_ROLE_ARN == '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Diff
        working-directory: infra
        env:
          USE_SECRETS_MANAGER: ${{ github.event.inputs.use_secrets_manager || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx cdk diff

      - name: CDK Deploy
        working-directory: infra
        env:
          USE_SECRETS_MANAGER: ${{ github.event.inputs.use_secrets_manager || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: npx cdk deploy --all --require-approval never --outputs-file cdk-outputs.json

      - name: Upload CDK Outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: infra/cdk-outputs.json
          retention-days: 30
